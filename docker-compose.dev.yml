      FACILITIES_SERVICE_URL: ${FACILITIES_SERVICE_URL:-http://facilities-service:3072}
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keephy-dev-network
    volumes:
      - ./backend:/app/backend
      - api-gateway-dev-node-modules:/app/backend/services/api-gateway/node_modules

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: keephy-identity-service-dev
    command: sh -c "cd services/identity-service && rm -rf node_modules/bcrypt 2>/dev/null || true && cd ../.. && rm -rf node_modules/bcrypt 2>/dev/null || true && npm install --legacy-peer-deps && npm uninstall bcrypt 2>/dev/null || true && npm install bcryptjs @types/bcryptjs --legacy-peer-deps && cd services/identity-service && npm run start:dev"
    working_dir: /app/backend
    env_file:
