# Development Environment Configuration
# Hot reload enabled, debug mode, development dependencies
# Use: docker compose -f docker-compose.dev.yml up

services:
  # ============================================
  # Database
  # ============================================
  postgres:
    image: postgres:14-alpine
    container_name: keephy-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${POSTGRES_DB:-hrmssystem_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Schema initialization - commented out if schema.sql doesn't exist or is a directory
      # - ./backend/docs/domain/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keephy-dev-network

  # ============================================
  # Backend Services
  # ============================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: keephy-api-gateway-dev
    command: sh -c "cd services/api-gateway && npm install --legacy-peer-deps && npm run start:dev"
    working_dir: /app/backend
    env_file:
      - .env.backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hrmssystem}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:4001}
      ACCESS_SERVICE_URL: ${ACCESS_SERVICE_URL:-http://access-service:4002}
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL:-http://media-service:4003}
      CONTACTS_SERVICE_URL: ${CONTACTS_SERVICE_URL:-http://contacts-service:4004}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-http://notifications-service:4006}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://audit-service:4007}
      TENANT_SERVICE_URL: ${TENANT_SERVICE_URL:-http://tenant-service:4023}
      FBMS_SERVICE_URL: ${FBMS_SERVICE_URL:-http://fbms-service:4014}
      SUBSCRIPTIONS_SERVICE_URL: ${SUBSCRIPTIONS_SERVICE_URL:-http://subscriptions-service:4010}
      ENTITLEMENTS_SERVICE_URL: ${ENTITLEMENTS_SERVICE_URL:-http://entitlements-service:4011}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing-service:4012}
      OBSERVABILITY_SERVICE_URL: ${OBSERVABILITY_SERVICE_URL:-http://observability-service:4013}
      HRMS_SERVICE_URL: ${HRMS_SERVICE_URL:-http://hrms-service:4015}
      SCM_SERVICE_URL: ${SCM_SERVICE_URL:-http://scm-service:4016}
      PAYROLL_SERVICE_URL: ${PAYROLL_SERVICE_URL:-http://payroll-service:4017}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:4017}
      CRM_SERVICE_URL: ${CRM_SERVICE_URL:-http://crm-service:4018}
      SUPPORT_SERVICE_URL: ${SUPPORT_SERVICE_URL:-http://support-service:4019}
      COMPLIANCE_SERVICE_URL: ${COMPLIANCE_SERVICE_URL:-http://compliance-service:4020}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:4021}
      EMS_SERVICE_URL: ${EMS_SERVICE_URL:-http://ems-service:4022}
      VOUCHER_SERVICE_URL: ${VOUCHER_SERVICE_URL:-http://voucher-service:4024}
      FORMS_SERVICE_URL: ${FORMS_SERVICE_URL:-http://forms-service:4025}
      BUILDER_SERVICE_URL: ${BUILDER_SERVICE_URL:-http://builder-service:4026}
      ONBOARDING_SERVICE_URL: ${ONBOARDING_SERVICE_URL:-http://onboarding-service:4027}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin-service:4028}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:4029}
