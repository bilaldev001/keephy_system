      MOBILE_SERVICE_URL: ${MOBILE_SERVICE_URL:-http://mobile-service:4032}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keephy-dev-network
    volumes:
      - ./backend:/app/backend
      - api-gateway-dev-node-modules:/app/backend/services/api-gateway/node_modules

