      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-Keephy1234Access1234Secret123456789}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-1800}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
